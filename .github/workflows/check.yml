name: check
# "on" is quoted because YAML 1.1 reads a bare on: as the boolean True, which
# GitHub Actions rejects.
"on": [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: node --test src/hooks/simple-english-activate.test.js
      - run: python3 src/hooks/test_lint_hook.py
      - run: python3 src/hooks/test_reply_rules.py
      - run: python3 tools/ste-dictionary/ste_dict_lint.py --self-test
      # ste_lint.py carries the mechanical rules and the slop.tsv parser. It was
      # missing here, so a broken self-test could not fail the build.
      - run: python3 evals/ste_lint.py --self-test
      - run: python3 evals/check_numbers.py
      - run: python3 -m unittest evals.test_run_pi_bench
